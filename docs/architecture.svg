<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    
    <filter id="shadow-lg" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.09" />
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3B82F6" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="1080" fill="#FFFFFF" rx="16" />
  
  <!-- Outer Frame Border -->
  <rect x="1" y="1" width="898" height="1078" fill="none" stroke="#E2E8F0" stroke-width="1.5" rx="16" />

  <!-- HEADER -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="800" height="70" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="12" />
    <circle cx="35" cy="35" r="16" fill="#2563EB" />
    <path d="M 29 35 Q 35 25 41 35 Q 35 45 29 35 Z" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="35" cy="35" r="4" fill="#FFFFFF" />
    
    <text x="65" y="32" font-size="20" font-weight="700" fill="#0F172A">ClickPost Radar</text>
    <text x="65" y="50" font-size="13" font-weight="500" fill="#64748B">AI-Powered Account Intelligence &amp; Outbound Activation Architecture</text>
    
    <rect x="670" y="23" width="115" height="24" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" rx="12" />
    <text x="727" y="39" font-size="11" font-weight="600" fill="#2563EB" text-anchor="middle">v1.0 • Prototype</text>
  </g>

  <!-- FLOW CONNECTOR LINES -->
  <!-- Line 1: Input -> Collection -->
  <path d="M 450 200 L 450 230" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  
  <!-- Line 2: Collection -> Validation -->
  <path d="M 450 330 L 450 360" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Line 3: Validation -> Scoring -->
  <path d="M 450 460 L 450 490" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Line 4: Scoring -> Dual Engine Split -->
  <path d="M 450 590 L 450 620" stroke="#3B82F6" stroke-width="2" />
  <path d="M 260 620 L 640 620" stroke="#3B82F6" stroke-width="2" />
  <path d="M 260 620 L 260 650" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />
  <path d="M 640 620 L 640 650" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Line 5: Dual Engine -> Outputs Container -->
  <path d="M 260 760 L 260 790 L 450 790" stroke="#3B82F6" stroke-width="2" />
  <path d="M 640 760 L 640 790 L 450 790" stroke="#3B82F6" stroke-width="2" />
  <path d="M 450 790 L 450 820" stroke="#3B82F6" stroke-width="2" marker-end="url(#arrow)" />


  <!-- STAGE 1: INPUT DATA -->
  <g transform="translate(250, 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="400" height="70" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10" />
    <rect x="0" y="0" width="6" height="70" fill="#64748B" rx="3" />
    <!-- File Icon -->
    <path d="M 25 24 L 37 24 L 43 30 L 43 46 L 25 46 Z" fill="none" stroke="#2563EB" stroke-width="2" stroke-linejoin="round" />
    <path d="M 37 24 L 37 30 L 43 30" fill="none" stroke="#2563EB" stroke-width="2" />
    <text x="58" y="33" font-size="15" font-weight="700" fill="#0F172A">Input Data</text>
    <text x="145" y="33" font-size="12" font-weight="600" fill="#2563EB">companies.csv</text>
    <text x="58" y="52" font-size="12" font-weight="400" fill="#64748B">25 Sample Accounts</text>
  </g>


  <!-- STAGE 2: SIGNAL COLLECTION ENGINE -->
  <g transform="translate(150, 230)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10" />
    <rect x="0" y="0" width="6" height="100" fill="#2563EB" rx="3" />
    <!-- Magnifying Glass Search Icon -->
    <circle cx="35" cy="40" r="9" fill="none" stroke="#2563EB" stroke-width="2" />
    <line x1="42" y1="47" x2="50" y2="55" stroke="#2563EB" stroke-width="2" stroke-linecap="round" />
    
    <text x="65" y="33" font-size="15" font-weight="700" fill="#0F172A">Signal Collection Engine</text>
    <text x="245" y="33" font-size="12" font-weight="600" fill="#2563EB">collector.py</text>
    
    <text x="65" y="54" font-size="12" font-weight="400" fill="#475569">Multi-source automated scraping &amp; ingestion with resilient HTTP retries</text>
    
    <!-- Source Badges -->
    <rect x="65" y="65" width="90" height="22" fill="#F1F5F9" rx="4" />
    <text x="110" y="80" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">Careers Page</text>

    <rect x="163" y="65" width="90" height="22" fill="#F1F5F9" rx="4" />
    <text x="208" y="80" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">News RSS</text>

    <rect x="261" y="65" width="105" height="22" fill="#F1F5F9" rx="4" />
    <text x="313" y="80" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">Press Releases</text>

    <rect x="374" y="65" width="85" height="22" fill="#F1F5F9" rx="4" />
    <text x="416" y="80" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">Trustpilot</text>

    <rect x="467" y="65" width="70" height="22" fill="#F1F5F9" rx="4" />
    <text x="502" y="80" font-size="11" font-weight="500" fill="#334155" text-anchor="middle">Reddit</text>
  </g>


  <!-- STAGE 3: EVIDENCE & RELEVANCE VALIDATION -->
  <g transform="translate(180, 360)" filter="url(#shadow)">
    <rect x="0" y="0" width="540" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10" />
    <rect x="0" y="0" width="6" height="100" fill="#10B981" rx="3" />
    <!-- Checkmark Badge Icon -->
    <circle cx="35" cy="40" r="11" fill="#E6F4EA" />
    <path d="M 30 40 L 34 44 L 41 36" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <text x="60" y="33" font-size="15" font-weight="700" fill="#0F172A">Evidence &amp; Relevance Validation</text>
    <text x="310" y="33" font-size="12" font-weight="600" fill="#10B981">Zero-Hallucination Guardrails</text>

    <text x="60" y="54" font-size="12" font-weight="400" fill="#475569">Verifies exact company brand token alignment &amp; filters internal catch-all signals</text>

    <!-- Feature Pills -->
    <rect x="60" y="65" width="145" height="22" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" rx="4" />
    <text x="132" y="80" font-size="11" font-weight="500" fill="#065F46" text-anchor="middle">Exact Brand Querying</text>

    <rect x="213" y="65" width="155" height="22" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" rx="4" />
    <text x="290" y="80" font-size="11" font-weight="500" fill="#065F46" text-anchor="middle">Entity Token Matching</text>

    <rect x="376" y="65" width="140" height="22" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1" rx="4" />
    <text x="446" y="80" font-size="11" font-weight="500" fill="#065F46" text-anchor="middle">OTHER Filter Engine</text>
  </g>


  <!-- STAGE 4: INTENT SCORING ENGINE -->
  <g transform="translate(150, 490)" filter="url(#shadow)">
    <rect x="0" y="0" width="600" height="100" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10" />
    <rect x="0" y="0" width="6" height="100" fill="#3B82F6" rx="3" />
    <!-- Bar Chart Icon -->
    <rect x="26" y="42" width="4" height="12" fill="#3B82F6" rx="1" />
    <rect x="33" y="34" width="4" height="20" fill="#3B82F6" rx="1" />
    <rect x="40" y="28" width="4" height="26" fill="#3B82F6" rx="1" />

    <text x="58" y="33" font-size="15" font-weight="700" fill="#0F172A">Explainable Intent Scoring Engine</text>
    <text x="325" y="33" font-size="12" font-weight="600" fill="#2563EB">scorer.py</text>

    <text x="58" y="54" font-size="12" font-weight="400" fill="#475569">Deterministic weighted scoring (0–100 cap) with rule-based "Why Now" explanations</text>

    <!-- Priority Pills -->
    <rect x="58" y="65" width="145" height="22" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1" rx="4" />
    <text x="130" y="80" font-size="11" font-weight="600" fill="#991B1B" text-anchor="middle">High Priority (80–100)</text>

    <rect x="211" y="65" width="165" height="22" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1" rx="4" />
    <text x="293" y="80" font-size="11" font-weight="600" fill="#92400E" text-anchor="middle">Medium Priority (50–79)</text>

    <rect x="384" y="65" width="145" height="22" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" rx="4" />
    <text x="456" y="80" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">Low Priority (0–49)</text>
  </g>


  <!-- STAGE 5: DUAL GENERATION ENGINE (SPLIT CARDS) -->
  <!-- Left Sub-card: Research Brief Generator -->
  <g transform="translate(70, 650)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="110" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10" />
    <rect x="0" y="0" width="6" height="110" fill="#8B5CF6" rx="3" />
    <!-- Brain / Intelligence Icon -->
    <circle cx="30" cy="32" r="10" fill="#F3E8FF" />
    <path d="M 26 32 C 26 28 34 28 34 32 C 34 36 26 36 26 32 Z" fill="none" stroke="#8B5CF6" stroke-width="1.8" />

    <text x="48" y="30" font-size="14" font-weight="700" fill="#0F172A">Research Brief Generator</text>
    <text x="245" y="30" font-size="11" font-weight="600" fill="#8B5CF6">generator.py</text>

    <text x="18" y="55" font-size="11" font-weight="400" fill="#475569">• Executive Intent Summaries (&lt;150 words)</text>
    <text x="18" y="73" font-size="11" font-weight="400" fill="#475569">• Bulleted Verified Evidence Statements</text>
    <text x="18" y="91" font-size="11" font-weight="400" fill="#475569">• Recommended Outreach Angles &amp; Personas</text>
  </g>

  <!-- Right Sub-card: Signal-Aware Outreach Generator -->
  <g transform="translate(470, 650)" filter="url(#shadow)">
    <rect x="0" y="0" width="360" height="110" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="10" />
    <rect x="0" y="0" width="6" height="110" fill="#2563EB" rx="3" />
    <!-- Mail / Message Icon -->
    <rect x="20" y="24" width="20" height="15" fill="none" stroke="#2563EB" stroke-width="1.8" rx="2" />
    <path d="M 20 25 L 30 32 L 40 25" fill="none" stroke="#2563EB" stroke-width="1.8" />

    <text x="48" y="30" font-size="14" font-weight="700" fill="#0F172A">Signal-Aware SDR Outreach</text>
    <text x="260" y="30" font-size="11" font-weight="600" fill="#2563EB">generator.py</text>

    <text x="18" y="55" font-size="11" font-weight="400" fill="#475569">• Tailored Value Props (Hiring, Funding, etc.)</text>
    <text x="18" y="73" font-size="11" font-weight="400" fill="#475569">• Concise LinkedIn InMails (&lt;80 words)</text>
    <text x="18" y="91" font-size="11" font-weight="400" fill="#475569">• Conversational Permission-Based Email CTAs</text>
  </g>


  <!-- STAGE 6: GENERATED DELIVERABLES CONTAINER -->
  <g transform="translate(100, 820)" filter="url(#shadow-lg)">
    <!-- Container Box -->
    <rect x="0" y="0" width="700" height="210" fill="#FAFAFA" stroke="#D1D5DB" stroke-width="1.5" rx="12" />
    
    <!-- Top Label Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 688 0 Q 700 0 700 12 L 700 45 L 0 45 Z" fill="#F1F5F9" />
    <line x1="0" y1="45" x2="700" y2="45" stroke="#E2E8F0" stroke-width="1" />

    <!-- Icon & Title -->
    <rect x="16" y="12" width="22" height="22" fill="#F59E0B" rx="4" />
    <path d="M 22 17 L 32 17 L 32 29 L 22 29 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
    <text x="46" y="28" font-size="14" font-weight="700" fill="#0F172A">Generated Outputs</text>
    <text x="185" y="28" font-size="12" font-weight="500" fill="#64748B">Structured JSON &amp; CSV Artifacts in outputs/</text>

    <!-- Deliverable File Cards Grid -->
    <!-- Row 1: Signals JSON -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="8" />
      <circle cx="25" cy="30" r="10" fill="#EFF6FF" />
      <text x="25" y="34" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">{}</text>
      <text x="45" y="26" font-size="12" font-weight="700" fill="#0F172A">signals.json</text>
      <text x="45" y="44" font-size="11" font-weight="400" fill="#64748B">Normalized raw evidence &amp; metadata</text>
    </g>

    <!-- Row 1: Scored Accounts CSV & JSON -->
    <g transform="translate(360, 60)">
      <rect x="0" y="0" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="8" />
      <circle cx="25" cy="30" r="10" fill="#ECFDF5" />
      <text x="25" y="34" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">📊</text>
      <text x="45" y="26" font-size="12" font-weight="700" fill="#0F172A">scored_accounts.csv &amp; .json</text>
      <text x="45" y="44" font-size="11" font-weight="400" fill="#64748B">Ranked accounts &amp; "Why Now" reasons</text>
    </g>

    <!-- Row 2: Research Briefs JSON -->
    <g transform="translate(20, 130)">
      <rect x="0" y="0" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="8" />
      <circle cx="25" cy="30" r="10" fill="#F3E8FF" />
      <text x="25" y="34" font-size="11" font-weight="700" fill="#8B5CF6" text-anchor="middle">🧠</text>
      <text x="45" y="26" font-size="12" font-weight="700" fill="#0F172A">research_briefs.json</text>
      <text x="45" y="44" font-size="11" font-weight="400" fill="#64748B">SDR account intelligence &amp; evidence</text>
    </g>

    <!-- Row 2: Outreach Messages CSV -->
    <g transform="translate(360, 130)">
      <rect x="0" y="0" width="320" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" rx="8" />
      <circle cx="25" cy="30" r="10" fill="#FEF3C7" />
      <text x="25" y="34" font-size="11" font-weight="700" fill="#D97706" text-anchor="middle">✉️</text>
      <text x="45" y="26" font-size="12" font-weight="700" fill="#0F172A">outreach_messages.csv</text>
      <text x="45" y="44" font-size="11" font-weight="400" fill="#64748B">Personalized LinkedIn &amp; Email copy</text>
    </g>
  </g>
</svg>
